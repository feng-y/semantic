      target_layer: string
      target_asset_type: string   # "rule_map" or "none"
    recommended_reasons: [string]
    not_recommended_reasons: [string]
    needs_evidence_check: boolean
    evidence_gap: string
    merge_target: string
    source_candidate_ids: [string]
    evidence_refs: [string]

demand_models:
  - id: string
    name: string
    candidate_id: string
    semantic_validity: string
    validity_reason: string
    business_score: float
    value_score: float
    priority: float
    recommendation:
      status: string
      action: string
      target_layer: string
      target_asset_type: string   # "demand_model_map" or "none"
    recommended_reasons: [string]
    not_recommended_reasons: [string]
    needs_evidence_check: boolean
    evidence_gap: string
    merge_target: string
    source_candidate_ids: [string]
    evidence_refs: [string]

metadata:
  generated_at: string            # ISO 8601 timestamp
  candidates_source: string       # Source candidates file (e.g., "candidates.yaml")
  recommendation_count: integer   # Total number of recommendations generated
