[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-harness"
version = "0.0.1"
description = "Evidence-driven semantic construction pipeline for Claude Code"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
semantic-harness = "src.main:main"

[project.urls]
Homepage = "https://github.com/feng-y/semantic"
Documentation = "https://github.com/feng-y/semantic#readme"
Repository = "https://github.com/feng-y/semantic"
Issues = "https://github.com/feng-y/semantic/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
