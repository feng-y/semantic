[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-harness"
version = "0.0.3"
description = "Evidence-driven semantic construction pipeline for Claude Code"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
semantic-harness = "src.main:main"

[project.urls]
Homepage = "https://github.com/feng-y/semantic"
Documentation = "https://github.com/feng-y/semantic#readme"
Repository = "https://github.com/feng-y/semantic"
Issues = "https://github.com/feng-y/semantic/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
lint = [
    "ruff>=0.9.0",
]
typecheck = [
    "mypy>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    "build",
    "*.egg-info",
    ".eggs",
]

[tool.ruff.lint]
# Enforce strict rules on src/ only (production code)
# Tests have their own conventions (unused vars, pragmatic imports)
select = ["E", "F"]
ignore = [
    "E501",   # line too long (style, tracked in tech-debt-tracker.md T004)
    "F811",   # backward compat alias
    "F841",   # unused vars in tests (tests use pragmatic patterns)
]

[tool.mypy]
python_version = "3.10"
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    "build",
    "tests/fixtures",
]
ignore_missing_imports = true
warn_unused_configs = false
