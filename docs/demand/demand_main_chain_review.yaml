strengths:
  - normalize/map/match/build/validate are connected into a coherent demand chain.
  - Card assembly preserves the canonical minimal Demand Card shape.
  - Validator is strict, including unknown-field rejection.
  - Mapping is deterministic and consumes real semantic foundation maps.
  - Demand tests are substantial and include step-level and chain-level checks.

gaps:
  - demand-model-map integration is wired but low-signal in current repository data because demand_models are empty.
  - match behavior remains primarily text/rule-driven when no demand-model hints are available.

blocking_issues: []

recommended_fixes:
  - priority: medium
    target: semantic foundation demand-model-map generation path
    issue: Sparse/empty demand-model-map limits practical grounding for match hints.
    recommendation: Emit minimally useful demand model entries from semantic stage outputs.
  - priority: low
    target: tests/demand/test_match_development_type.py
    issue: Demand-model integration is currently validated with synthetic fixtures only.
    recommendation: Add fixture-backed tests using a non-empty demand-model-map sample.

decisions:
  demand_main_chain_ready: true
