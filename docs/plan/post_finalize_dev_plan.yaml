plan_target: post_finalize_semantic_development

current_state:
  semantic_capabilities_present:
    - semantic-signals
    - semantic-candidates
    - semantic-recommend
    - semantic-review
    - semantic-finalize
  
  composite_skills_present:
    - semantic-pipeline
    - semantic-fact-pipeline
  
  runner_infrastructure:
    - src/semantic/run.py (basic runner exists)
    - src/semantic/runner_models.py (RunState model exists)
    - src/semantic/stage_registry.py (stage registry exists)
  
  status_capability:
    - semantic-status (exists but basic)
  
  gaps:
    - No validation layer
    - No finalize guard integration in runner
    - No incremental execution
    - No cache layer
    - No feedback loop
    - Runner is minimal (next/all only)
    - Status doesn't provide --next recommendation

immediate_next_priority: "semantic-runner with finalize guard integration and validation"

p0:
  - item: "semantic-runner enhancement"
    reason: "Current runner is minimal. Need proper stage orchestration with blocking conditions, finalize guard integration, and resume capability"
    expected_outcome: "Runner can execute semantic-pipeline with proper gating, handle interruptions, and enforce finalize guard"
    
  - item: "semantic-validate capability"
    reason: "No validation layer exists. Need to catch schema drift, invalid actions, missing required fields before they propagate"
    expected_outcome: "Validation catches structural errors, invalid review actions, missing evidence checks, schema violations"
    
  - item: "semantic-status --next"
    reason: "Users need guidance on what to run next after interruptions or errors"
    expected_outcome: "Status can recommend next command, explain blocking conditions, show current stage"
    
  - item: "Finalize guard integration"
    reason: "Finalize guard logic exists in finalize_assets.py but not integrated into runner control flow"
    expected_outcome: "Runner blocks finalize when verify_first unresolved, shows clear error message"

p1:
  - item: "Incremental execution for semantic-signals"
    reason: "Full FACT re-analysis is expensive. Need to detect changes and only re-extract signals from changed areas"
    expected_outcome: "Signals extraction skips unchanged files, reuses cached signals, reduces token cost"
    
  - item: "Confidence-based auto-accept"
    reason: "High-confidence recommendations don't need manual review. Reduce human bottleneck"
    expected_outcome: "High-confidence items auto-accepted with audit log, medium/low still require review"
    
  - item: "End-to-end golden fixture tests"
    reason: "Need to verify full chain works: FACT → signals → candidates → recommend → review → finalize"
    expected_outcome: "Golden test suite catches regressions in semantic chain"
    
  - item: "Cache layer for expensive operations"
    reason: "AST parsing, fact extraction, signal inference are expensive and often repeated"
    expected_outcome: "File-level cache with hash-based invalidation, significant performance improvement"

later_stage:
  - item: "Feedback loop from usage"
    reason: "Learn which knowledge is used, which fails, optimize based on real usage"
    
  - item: "LSP integration for better symbol extraction"
    reason: "Improve accuracy of domain/concept boundary detection"
    
  - item: "Multi-format export (JSON, GraphQL)"
    reason: "Make semantic assets easier to consume by other tools"
    
  - item: "Interactive review UI"
    reason: "Improve review experience beyond YAML editing"
    
  - item: "Distributed execution"
    reason: "Parallelize expensive stages across workers"

do_not_prioritize_yet:
  - "Full GraphQL API platform"
  - "Heavy visualization dashboard"
  - "Generalized plugin ecosystem"
  - "Multi-agent orchestration framework"
  - "Interactive shell with REPL"
  - "Broad platformization before workflow stability"

recommended_sequence:
  - "P0-1: Enhance semantic-runner (next, all, resume, blocking)"
  - "P0-2: Build semantic-validate"
  - "P0-3: Integrate finalize guard into runner"
  - "P0-4: Add semantic-status --next"
  - "P1-1: Incremental signals extraction"
  - "P1-2: Confidence-based auto-accept"
  - "P1-3: End-to-end golden tests"
  - "P1-4: Cache layer"
  - "Later: Feedback loop, LSP, multi-format export"

key_relationships:
  runner_vs_pipeline: "semantic-pipeline is a composite skill that invokes individual stages. semantic-runner is the orchestration engine that manages state, blocking, and resume. Pipeline delegates to runner."
  
  runner_vs_status: "semantic-status reads runner state and recommends next action. Status is read-only query, runner is execution engine. Status depends on runner state format."
  
  validate_vs_runner: "semantic-validate is called by runner before/after each stage. Validation is a guardrail layer. Runner enforces validation results by blocking on failures."
  
  incremental_vs_cache: "Incremental execution detects what changed. Cache stores expensive computation results. Incremental uses cache to skip unchanged work. Both reduce cost but serve different purposes."
  
  feedback_loop_position: "Feedback loop is P1, not P0. Need stable workflow first before optimizing based on usage patterns. Feedback informs future improvements to signal extraction, candidate synthesis, and review criteria."

final_recommendation:
  summary: "Build semantic-runner with validation and finalize guard integration first (P0). This turns the five semantic capabilities into a reliable, controllable workflow system. Then add incremental execution and auto-accept to reduce cost and friction (P1). Defer platformization until workflow is proven stable."
  
  rationale: "The semantic chain exists but lacks orchestration, validation, and control. Users must manually run 5 commands in sequence, with no guidance on errors or blocking conditions. P0 fixes this by adding runner + validation + status. P1 reduces cost and friction. Later stages add optimization and platform features only after core workflow is stable."
  
  success_criteria:
    - "User can run semantic-pipeline and it completes or stops with clear error"
    - "Finalize guard blocks correctly when verify_first unresolved"
    - "Validation catches schema errors before they propagate"
    - "Status --next tells user what to run after interruption"
    - "Incremental execution reduces token cost by 50%+ on second run"
    - "High-confidence items auto-accepted, reducing review burden"
