      - signals.md
      - candidates.md
      - recommendations.md
      - review-note.md
    final:
      - domain-map.md
      - concept-map.md
      - rule-map.md
      - demand-model-map.md
  fact_input_sources:
    primary_hard: fact_canonical_sample.yaml + docs/fact/baseline/*.md
    auxiliary_soft: fact_working_summary_sample.yaml
