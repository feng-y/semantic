    reason: "Marked as transitional document with deprecation notice"
    changes:
      - "Added transitional document notice at top"
      - "Clarified canonical output name is 'candidates.yaml' not 'step2_candidates.yaml'"
      - "Pointed to semantic_stage_contracts.md as canonical reference"

  - path: docs/semantic-foundation/semantic/README.md
    reason: "Clarified workspace distinction and updated to English"
    changes:
      - "Translated from Chinese to English"
      - "Added workspace distinction section (FACT runtime vs semantic documentation vs semantic output)"
      - "Listed all contract documents"
      - "Listed all stage design documents"
      - "Marked transitional documents explicitly"
      - "Clarified canonical layer name is 'semantic'"

fixed_issues:
  - severity: high
    issue: "Missing Step1 design doc"
    resolution: "Created 01_step1_signal_inference.md with complete Step1 (Signal Inference) design aligned with semantic_stage_contracts.md"

  - severity: high
    issue: "Workspace location inconsistency"
    resolution: "Clarified three distinct workspaces: docs/semantic/ (FACT runtime + semantic output), docs/semantic-foundation/semantic/ (semantic documentation), distinction now explicit in README.md"

  - severity: high
    issue: "Package naming drift (semantic_asset_build vs semantic)"
    resolution: "Marked semantic_asset_build as legacy naming, clarified semantic is canonical, added deprecation notices to all docs using old naming"

  - severity: medium
    issue: "View outputs incomplete in contract"
    resolution: "Added 4 intermediate view outputs (signals.md, candidates.md, recommendations.md, review-note.md) to semantic_output_contract.md, updated summary to 8 total view outputs"

  - severity: medium
    issue: "Language barrier (Chinese docs)"
    resolution: "Added English deprecation notices to all Chinese docs pointing to canonical English contract documents, translated README.md to English"

  - severity: medium
    issue: "Output file naming inconsistency (step2_candidates.yaml vs candidates.yaml)"
    resolution: "Clarified canonical names in deprecation notices, semantic_output_contract.md uses canonical names (candidates.yaml not step2_candidates.yaml)"

  - severity: low
    issue: "Input directory inconsistency (docs/semantic/* vs docs/fact/baseline/*)"
    resolution: "Clarified in deprecation notices that canonical FACT input is docs/fact/baseline/* not docs/semantic/*"

deferred_issues:
  - severity: low
    issue: "Field name drift (responsibility/modules vs summary/boundary)"
    reason: "Contract documents use canonical field names, design docs provide explanatory context, both are valid for their purposes, no implementation ambiguity remains"

  - severity: low
    issue: "Full translation of Chinese documents"
    reason: "Deprecation notices point to canonical English documents, full translation not required as canonical references exist"

remaining_risks:
  - "Developers may still reference transitional documents (00_overall_design.md, 01_step2_candidate_synthesis.md) instead of canonical contracts - mitigated by prominent deprecation notices"
  - "Legacy naming (semantic_asset_build) may persist in code comments or informal discussion - mitigated by clear documentation of canonical naming"

decisions:
  docs_ready_for_implementation: true
  blocking_issues_resolved: true
  naming_normalized: true
  workspace_semantics_clarified: true
  stage_sequence_complete: true
  output_contract_aligned: true
  runner_semantics_aligned: true

