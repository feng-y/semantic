assessments:
  fact_input_readiness: partial
  doc_readiness: pass
  prompt_template_alignment: pass
  code_skeleton_readiness: partial

gaps:
  - "docs/fact/baseline/*.md files do not exist (directory empty except .keep)"
  - "docs/semantic/ output workspace does not exist"
  - "src/semantic/models.py lacks Signal-specific models"
  - "src/semantic/extract_signals.py is scaffold only, needs full implementation"
  - "No step1-specific tests exist yet"

blocking_issues:
  - "docs/fact/baseline/*.md files missing - Step1 contract requires these as primary input"
  - "Without baseline files, Step1 cannot extract signals from FACT layer"

recommended_fixes:
  - priority: high
    target: "docs/fact/baseline/*.md"
    issue: "Baseline files do not exist"
    recommendation: "Either: (1) Run FACT pipeline to generate baseline, OR (2) Create sample baseline files for testing, OR (3) Modify Step1 to work with fact_canonical_sample.yaml only"

  - priority: high
    target: "docs/semantic/ workspace"
    issue: "Output workspace does not exist"
    recommendation: "Create docs/semantic/ directory before running Step1"

  - priority: medium
    target: "src/semantic/models.py"
    issue: "No Signal models defined"
    recommendation: "Add Signal, DomainSignal, ConceptSignal, RuleSignal, DemandPatternSignal models"

  - priority: medium
    target: "src/semantic/extract_signals.py"
    issue: "Only scaffold implementation exists"
    recommendation: "Implement full signal extraction logic"

  - priority: low
    target: "tests/semantic/"
    issue: "No step1-specific tests"
    recommendation: "Add test_extract_signals.py with signal extraction tests"

decisions:
  can_implement_step1_signals: false
  blocking_reason: "Primary FACT input (docs/fact/baseline/*.md) does not exist"
  workaround_available: true
  workaround_description: "Can modify Step1 to work with fact_canonical_sample.yaml only, or generate sample baseline files"

alternative_approaches:
  - approach: "Use fact_canonical_sample.yaml as sole primary input"
    feasibility: high
    changes_required:
      - "Update semantic_stage_contracts.md to make baseline/*.md optional"
      - "Update 01_step1_signal_inference.md to clarify canonical YAML is sufficient"
      - "Implement extract_signals.py to parse YAML directly"

  - approach: "Generate sample baseline files from fact_canonical_sample.yaml"
    feasibility: high
    changes_required:
      - "Create docs/fact/baseline/purpose.md from canonical YAML"
      - "Create docs/fact/baseline/pipelines.md from canonical YAML"
      - "Create docs/fact/baseline/domains.md from canonical YAML"
      - "Create docs/fact/baseline/concepts.md from canonical YAML"

  - approach: "Run full FACT pipeline first"
    feasibility: medium
    changes_required:
      - "Execute discover → review → refine → baseline"
      - "Wait for baseline generation"
      - "Then proceed with Step1"

notes:
  - "All semantic documentation is ready and aligned"
  - "Prompt and template are aligned with contracts"
  - "Code skeleton exists and is usable"
  - "Only blocker is missing FACT baseline files"
  - "Workarounds are available and straightforward"
  - "Recommended: Use fact_canonical_sample.yaml as primary input (simplest path)"
