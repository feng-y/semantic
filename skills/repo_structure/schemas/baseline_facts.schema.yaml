$schema: "https://json-schema.org/draft/2020-12/schema"
schema_name: repo_structure_baseline_facts
schema_version: v1
type: object
additionalProperties: false
required: [metadata, facts, conflicts]
properties:
  metadata:
    type: object
    additionalProperties: false
    required: [version, repo_snapshot_commit, sources, generated_at]
    properties:
      version:
        type: string
        pattern: "^v[0-9]+$"
      repo_snapshot_commit:
        type: string
      sources:
        type: object
        properties:
          hotspot_map:
            type: string
          codebase_map:
            type: string
          architect_augment:
            type: string
      generated_at:
        type: string
        format: date-time
      arbitration:
        type: object
        description: Arbitration metadata
  facts:
    type: array
    items:
      $ref: "fact_entry.schema.yaml"
  conflicts:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [fact_ids, conflict_type, resolution_status]
      properties:
        fact_ids:
          type: array
          items:
            type: string
        conflict_type:
          type: string
          enum: [contradictory_statement, snapshot_drift, source_priority_tie, evidence_strength_tie, unresolved_merge]
        explanation:
          type: string
        resolution_status:
          type: string
          enum: [preserved, resolved, dropped]
  lineage:
    type: object
    description: Maps fact_id to source artifact + version
