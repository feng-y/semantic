name: semantic-candidates
description: >
  Synthesize semantic candidates from signals.
  Generates domain, concept, rule, and demand model candidates.
entrypoint: semantic.build_candidates

inputs:
  signals: docs/semantic-foundation/semantic/signals.yaml
  output: docs/semantic-foundation/semantic/candidates.yaml
  render_md: docs/semantic-foundation/semantic/candidates.md

outputs:
  - docs/semantic-foundation/semantic/candidates.yaml
  - docs/semantic-foundation/semantic/candidates.md
